# local-llm-mcp runtime config
server:
  name: "Local LLM MCP Server"
  host: "127.0.0.1"
  port: 10833

model:
  default_provider: "ollama"
  default_model: "muse-glimmer-30b"

# Extra providers surfaced via GET /api/v1/providers and the dashboard.
providers:
  local-llama:
    enabled: true
    name: "Muse Glimmer (llama.cpp :11435)"
    type: "openai-compatible"
    base_url: "http://127.0.0.1:11435/v1"
    description: "Muse Glimmer 30B via llama.cpp (multimodal, DFlash drafter)"
    models:
      - name: "muse-glimmer-30b"
        display_name: "Muse Glimmer 30B (Goliath)"
        context_window: 131072
        max_output_tokens: 4096
        modalities:
          input: ["text", "image"]
          output: ["text"]
